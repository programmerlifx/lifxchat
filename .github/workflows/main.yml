
name: Build LIFX Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LIFX Chat APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          PROJECT=""

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT="$(pwd)"
          else
            ZIP="$(find . -type f -iname '*.zip' \
              -not -path './.git/*' | head -n 1)"

            if [ -n "$ZIP" ]; then
              mkdir -p "$RUNNER_TEMP/lifx-source"
              unzip -oq "$ZIP" -d "$RUNNER_TEMP/lifx-source"

              PROJECT="$(find "$RUNNER_TEMP/lifx-source" \
                -type f -name 'settings.gradle.kts' \
                -exec dirname {} \; | head -n 1)"
            fi
          fi

          if [ -z "$PROJECT" ] || \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "::error::Proyek Android tidak ditemukan."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT"

      - name: Configure Firebase
        shell: bash
        run: |
          set -e
          DEST="$PROJECT_DIR/app/google-services.json"

          if [ -f "$DEST" ]; then
            echo "Firebase config sudah tersedia."
          elif [ -f "app/google-services.json" ]; then
            mkdir -p "$PROJECT_DIR/app"
            cp app/google-services.json "$DEST"
          elif [ -f "google-services.json" ]; then
            mkdir -p "$PROJECT_DIR/app"
            cp google-services.json "$DEST"
          else
            echo "::error::google-services.json tidak ditemukan."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::error::sdkmanager tidak ditemukan di $SDK."
            find /usr/local/lib/android/sdk/cmdline-tools \
              -maxdepth 3 -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses \
            >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/google-services.json

          echo "Pemeriksaan proyek berhasil."

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFX-Chat-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
