
name: Build LIFX Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        shell: bash
        run: |
          ZIP="LIFXChat-Android-Project.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP proyek tidak ditemukan di root repository."
            echo "Daftar file ZIP yang tersedia:"
            find . -maxdepth 2 -type f -iname '*.zip'
            exit 1
          fi

      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q LIFXChat-Android-Project.zip -d extracted

          PROJECT="extracted/LIFXChat"

          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "::error::Folder proyek LIFXChat tidak ditemukan di dalam ZIP."
            find extracted -maxdepth 3 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Apply Firebase configuration
        shell: bash
        run: |
          PROJECT="extracted/LIFXChat"

          if [ -f "app/google-services.json" ]; then
            cp app/google-services.json "$PROJECT/app/google-services.json"
          elif [ -f "google-services.json" ]; then
            cp google-services.json "$PROJECT/app/google-services.json"
          elif [ -f "$PROJECT/app/google-services.json" ]; then
            echo "Menggunakan konfigurasi Firebase dari ZIP."
          else
            echo "::error::google-services.json tidak ditemukan."
            exit 1
          fi

          echo "Konfigurasi Firebase siap."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Validate project files
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/google-services.json

          echo "File proyek lengkap."

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::File APK tidak ditemukan."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFX-Chat-debug-APK
          path: extracted/LIFXChat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
