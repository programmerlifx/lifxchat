
name: Build LIFX Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check project files
        shell: bash
        run: |
          echo "Memeriksa struktur proyek..."

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::File tidak ditemukan: $file"
              echo "Pastikan isi proyek Android sudah diunggah ke root repository."
              exit 1
            fi
          done

          echo "Semua file utama proyek ditemukan."

      - name: Check Firebase configuration
        shell: bash
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "::error::app/google-services.json tidak ditemukan."
            echo "Unggah file konfigurasi Firebase ke folder app."
            exit 1
          fi

          echo "Konfigurasi Firebase ditemukan."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show build environment
        run: |
          java -version
          gradle --version
          echo "Android SDK: $ANDROID_HOME"

      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah proses build."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK berhasil dibuat."
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIFX-Chat-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
