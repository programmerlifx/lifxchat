
name: Build LIFX Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=""

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT="."
          else
            ZIP="$(find . -type f -iname '*.zip' \
              -not -path './.git/*' | head -n 1)"

            if [ -n "$ZIP" ]; then
              mkdir -p "$RUNNER_TEMP/lifx-source"
              unzip -oq "$ZIP" -d "$RUNNER_TEMP/lifx-source"

              PROJECT="$(find "$RUNNER_TEMP/lifx-source" \
                -type f -name 'settings.gradle.kts' \
                -exec dirname {} \; | head -n 1)"
            fi
          fi

          if [ -z "$PROJECT" ] || \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "::error::Proyek Android tidak ditemukan."
            echo "File yang tersedia di repository:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$(realpath "$PROJECT")" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT"

      - name: Configure Firebase
        shell: bash
        run: |
          DEST="$PROJECT_DIR/app/google-services.json"

          if [ -f "$DEST" ]; then
            echo "Firebase config ditemukan di proyek."
          elif [ -f "app/google-services.json" ]; then
            cp app/google-services.json "$DEST"
          elif [ -f "google-services.json" ]; then
            cp google-services.json "$DEST"
          else
            echo "::error::google-services.json tidak ditemukan."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFX-Chat-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
